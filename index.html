<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — Flurze</title>
  <meta name="robots" content="noindex">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── BG image slot — swap url() below with your image path ── */
    :root {
      --bg-image: url('redirect-image.jpg'); /* <-- paste your image URL here */
      --overlay: rgba(0, 0, 0, 0.45);
      --accent: #e8d5b0;
      --text: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.18);
      --radius: 16px;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      color: var(--text);
      background-color: #1a1a1a; /* fallback when no image */
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Dark overlay for readability */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 0;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 92vw);
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.5rem, 5vw, 3rem);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      text-align: center;
      animation: fadeUp .55s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Logo / Brand ── */
    .brand {
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.8rem);
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--accent);
      margin-bottom: .25rem;
    }

    .tagline {
      font-size: clamp(.78rem, 2.5vw, .9rem);
      letter-spacing: .15em;
      text-transform: uppercase;
      opacity: .65;
      margin-bottom: 2.2rem;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--card-border);
      margin: 0 auto 2rem;
    }

    /* ── Message ── */
    .message {
      font-size: clamp(.92rem, 2.8vw, 1rem);
      line-height: 1.65;
      opacity: .85;
      margin-bottom: 2rem;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      height: 3px;
      background: rgba(255,255,255,.15);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      animation: fill var(--countdown, 3s) linear forwards;
    }

    /* ── Counter ── */
    .counter {
      font-size: .82rem;
      opacity: .5;
      letter-spacing: .05em;
    }

    /* ── CTA link ── */
    .cta {
      display: inline-block;
      margin-top: 1.6rem;
      padding: .7rem 2rem;
      border: 1px solid var(--accent);
      border-radius: 99px;
      color: var(--accent);
      text-decoration: none;
      font-size: .88rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .2s, color .2s;
    }
    .cta:hover, .cta:focus-visible {
      background: var(--accent);
      color: #1a1a1a;
      outline: none;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fill {
      to { width: 100%; }
    }
  </style>
  <!--
    Optional: swap in your preferred Google Fonts.
    These are loaded async to keep the page fast.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="card" role="main">
    <div class="brand">Flurze</div>
    <p class="tagline">flurze.online</p>
    <div class="divider"></div>

    <p class="message">
      Your vedios is on the way.<br>
      This will only take a moment.
    </p>

    <div class="progress-wrap" aria-hidden="true">
      <div class="progress-bar" style="--countdown: 3s;"></div>
    </div>

    <p class="counter" id="counter">Redirecting in <span id="secs">5</span>s</p>

    <a class="cta" href="http://flurze.online/" id="cta-link">Go now →</a>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────────
    const TARGET  = 'http://flurze.online/';
    const DELAY   = 3; // seconds before auto-redirect
    // ────────────────────────────────────────────────────────

    let t = DELAY;
    const secsEl = document.getElementById('secs');

    const tick = setInterval(() => {
      t--;
      secsEl.textContent = t;
      if (t <= 0) {
        clearInterval(tick);
        window.location.replace(TARGET);
      }
    }, 1000);

    // Allow instant redirect on CTA click
    document.getElementById('cta-link').addEventListener('click', e => {
      clearInterval(tick);
    });
  </script>
</body>
</html>
